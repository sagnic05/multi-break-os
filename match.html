<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntax Match V4.0 | Multi-Break OS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css"> 
    
    <style>
        body { background: #f0f4f8; background: radial-gradient(circle at top right, #fdfbfb 0%, #e2ebf0 100%); color: #2d3748; font-family: 'Inter', sans-serif; min-height: 100vh; position: relative;}
        .bg-shape { position: fixed; border-radius: 50%; filter: blur(120px); z-index: -10; opacity: 0.6; pointer-events: none; }
        .shape-1 { width: 400px; height: 400px; background: #4facfe; top: -100px; left: -100px; }
        .shape-2 { width: 500px; height: 500px; background: #fa709a; bottom: -150px; right: -100px; }
        .shape-3 { width: 300px; height: 300px; background: #a18cd1; top: 30%; left: 20%; }
        
        #game-container { max-width: 900px; margin: 40px auto; position: relative; z-index: 10; padding: 0 20px 50px 20px; }
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .sys-stats { display: flex; gap: 15px; font-family: 'Fira Code', monospace; font-weight: 800; color: #1a202c; flex-wrap: wrap; }
        .stat-box { background: rgba(255,255,255,0.4); backdrop-filter: blur(15px); padding: 12px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 4px 10px rgba(0,0,0,0.05), inset 0 0 10px rgba(255,255,255,0.4); font-size: 0.95rem; }
        .env-badge { color: #b224ef; border-color: rgba(178, 36, 239, 0.4);}
        .score-badge { color: #4facfe; border-color: rgba(79, 172, 254, 0.4);}

        .match-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; perspective: 1000px; margin-top: 30px; }
        .card { width: 100%; height: 140px; position: relative; cursor: pointer; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; justify-content: center; align-items: center; border-radius: 16px; font-family: 'Fira Code', monospace; font-weight: 800; text-align: center; padding: 10px; box-shadow: 0 8px 25px rgba(31, 38, 135, 0.08), inset 0 0 15px rgba(255,255,255,0.5); }
        
        .card-front { background: linear-gradient(135deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.2)); backdrop-filter: blur(10px); border: 2px solid rgba(255,255,255,0.9); color: #4facfe; font-size: 2rem; transition: all 0.3s ease; }
        .card:hover:not(.flipped) .card-front { background: rgba(255,255,255,0.8); box-shadow: 0 10px 30px rgba(0, 242, 254, 0.2); border-color: #00f2fe; transform: translateY(-5px); }
        
        .card-back { background: linear-gradient(135deg, #1a202c, #2d3748); border: 2px solid #00f2fe; color: #fff; transform: rotateY(180deg); font-size: 1.1rem; text-shadow: 0 0 8px rgba(0,242,254,0.5); word-wrap: break-word; }
        .card.matched .card-back { border-color: #43e97b; background: linear-gradient(135deg, #0f3e22, #1a202c); color: #43e97b; box-shadow: 0 0 20px rgba(67, 233, 123, 0.4), inset 0 0 15px rgba(67, 233, 123, 0.2); text-shadow: 0 0 10px rgba(67,233,123,0.5); }

        @keyframes wrongShake { 0%, 100% { transform: rotateY(180deg) translateX(0); border-color: #ff0844; box-shadow: 0 0 20px rgba(255,8,68,0.5);} 25%, 75% { transform: rotateY(180deg) translateX(-10px); border-color: #ff0844; } 50% { transform: rotateY(180deg) translateX(10px); border-color: #ff0844; } }
        .card.wrong .card-back { animation: wrongShake 0.5s ease-in-out; }

        .fallback-btn { background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.8); padding: 12px 24px; border-radius: 12px; cursor: pointer; font-weight: 800; color: #1a202c; position: relative; z-index: 30; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.05); font-size: 0.9rem; }
        .fallback-btn:hover { background: rgba(255, 95, 86, 0.8); color: white; border-color: transparent; box-shadow: 0 8px 20px rgba(255, 95, 86, 0.3); transform: translateY(-2px); }

        @media (max-width: 600px) { .match-grid { grid-template-columns: repeat(3, 1fr); } .card { height: 120px; font-size: 0.9rem;} }
   /* ==========================================
   --- COMPACT LAPTOP SCREEN FIX ---
   ========================================== */
#game-container {
    margin: 10px auto !important; 
    padding: 0 15px 15px 15px !important;
}
.game-header {
    margin-bottom: 10px !important; 
}
.glass-panel, .glass-card {
    padding: 15px 25px !important; 
    margin-bottom: 15px !important; 
}
h2, .module-title {
    margin-top: 0 !important;
    margin-bottom: 5px !important;
    font-size: 1.5rem !important;
}
p, .module-desc {
    margin-bottom: 5px !important;
}
.telemetry-box {
    padding: 15px !important;
    gap: 10px !important;
}
   </style>
</head>
<body>

    <div class="bg-shape shape-1"></div><div class="bg-shape shape-2"></div><div class="bg-shape shape-3"></div>

    <div id="game-container">
        
        <div class="game-header">
            <button class="fallback-btn" onclick="window.location.href='index.html'"><i class="fa-solid fa-arrow-left"></i> SYSTEM ABORT</button>
            <div class="sys-stats">
                <div class="stat-box env-badge">ENV: <span id="ui-env">BOOTING</span></div>
                <div class="stat-box score-badge">DECRYPTED: <span id="ui-score">0</span> / 6</div>
            </div>
        </div>

        <div class="glass-panel" style="text-align: center; padding: 25px;">
            <h2 style="margin-bottom: 10px; color: #1a202c; font-size: 1.8rem; font-weight: 900;"><i class="fa-solid fa-microchip" style="color: #4facfe;"></i> SYNTAX MATCH V4.0</h2>
            <p style="color: #4a5568; font-weight: 700; font-family: 'Fira Code', monospace; font-size: 0.95rem;">> Decrypt the buffer by pairing the syntax with its definition.</p>
        </div>

        <div class="match-grid" id="grid-container"></div>
    </div>

    <div id="victory-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.2); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); justify-content: center; align-items: center; z-index: 1000;">
        <div class="glass-panel" style="text-align: center; max-width: 500px; padding: 50px; border: 2px solid rgba(67, 233, 123, 0.8); box-shadow: 0 20px 60px rgba(67, 233, 123, 0.2), inset 0 0 30px rgba(255,255,255,0.6);">
            <h2 style="color: #43e97b; font-size: 2.8rem; margin-bottom: 15px; font-weight: 900; text-shadow: 0 0 15px rgba(67,233,123,0.4);"><i class="fa-solid fa-unlock"></i> DECRYPTED</h2>
            <p style="font-size: 1.1rem; color: #4a5568; margin-bottom: 35px; font-weight: 700; font-family: 'Fira Code', monospace;">Memory buffer successfully paired.<br>Security layer bypassed.</p>
            <button class="fallback-btn" style="background: linear-gradient(135deg, #43e97b, #38f9d7); color: white; border: none; padding: 15px 35px; font-size: 1.1rem; box-shadow: 0 10px 25px rgba(67, 233, 123, 0.4);" onclick="window.location.href='index.html'">RETURN TO OS</button>
        </div>
    </div>

    <script src="audio-manager.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const levelData = {
                python: [ { id: 1, text1: 'def', text2: 'Function\nDeclaration' }, { id: 2, text1: '[]', text2: 'List\nArray' }, { id: 3, text1: '{}', text2: 'Dictionary\nHash Map' }, { id: 4, text1: '**', text2: 'Exponentiation' }, { id: 5, text1: '//', text2: 'Floor\nDivision' }, { id: 6, text1: 'elif', text2: 'Else If\nCondition' } ],
                java: [ { id: 1, text1: 'public', text2: 'Access\nModifier' }, { id: 2, text1: 'String[]', text2: 'Array\nDeclaration' }, { id: 3, text1: 'System.out', text2: 'Standard\nOutput' }, { id: 4, text1: 'final', text2: 'Constant\nVariable' }, { id: 5, text1: 'extends', text2: 'Class\nInheritance' }, { id: 6, text1: 'implements', text2: 'Interface\nAdoption' } ],
                javascript: [ { id: 1, text1: '=>', text2: 'Arrow\nFunction' }, { id: 2, text1: '===', text2: 'Strict\nEquality' }, { id: 3, text1: 'let', text2: 'Block Scope\nVariable' }, { id: 4, text1: 'Promise', text2: 'Async\nOperation' }, { id: 5, text1: 'NaN', text2: 'Not a\nNumber' }, { id: 6, text1: '${...}', text2: 'Template\nLiteral' } ],
                cpp: [ { id: 1, text1: 'cout <<', text2: 'Standard\nOutput' }, { id: 2, text1: '*ptr', text2: 'Pointer\nDereference' }, { id: 3, text1: '&ref', text2: 'Memory\nAddress' }, { id: 4, text1: 'virtual', text2: 'Overridable\nMethod' }, { id: 5, text1: 'std::', text2: 'Standard\nNamespace' }, { id: 6, text1: 'new', text2: 'Dynamic\nAllocation' } ],
                kotlin: [ { id: 1, text1: 'fun', text2: 'Function\nDeclaration' }, { id: 2, text1: 'val', text2: 'Immutable\nVariable' }, { id: 3, text1: 'var', text2: 'Mutable\nVariable' }, { id: 4, text1: 'String?', text2: 'Nullable\nType' }, { id: 5, text1: '!!', text2: 'Not-Null\nAssertion' }, { id: 6, text1: 'when', text2: 'Switch\nExpression' } ]
            };

            let currentLang = 'python';
            let activePairs = [];
            let cardDeck = [];
            let firstCard = null, secondCard = null;
            let lockBoard = false; 
            let matchedPairs = 0;
            const targetPairs = 6;

            const uiEnv = document.getElementById('ui-env');
            const uiScore = document.getElementById('ui-score');
            const gridContainer = document.getElementById('grid-container');
            const victoryModal = document.getElementById('victory-modal');

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('lang') && levelData[urlParams.get('lang')]) currentLang = urlParams.get('lang');
            uiEnv.innerText = currentLang.toUpperCase();
            
            activePairs = levelData[currentLang];
            buildDeck();

            function buildDeck() {
                activePairs.forEach(pair => { cardDeck.push({ id: pair.id, text: pair.text1 }); cardDeck.push({ id: pair.id, text: pair.text2 }); });
                for (let i = cardDeck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [cardDeck[i], cardDeck[j]] = [cardDeck[j], cardDeck[i]]; }
                renderGrid();
            }

            function renderGrid() {
                gridContainer.innerHTML = '';
                cardDeck.forEach((cardItem) => {
                    const cardElement = document.createElement('div');
                    cardElement.classList.add('card');
                    cardElement.dataset.id = cardItem.id; 
                    cardElement.innerHTML = `<div class="card-face card-front"><i class="fa-solid fa-lock"></i></div><div class="card-face card-back">${cardItem.text}</div>`;
                    cardElement.addEventListener('click', flipCard);
                    gridContainer.appendChild(cardElement);
                });
            }

            function flipCard() {
                if (lockBoard || this === firstCard || this.classList.contains('matched')) return;
                this.classList.add('flipped');
                if (!firstCard) { firstCard = this; return; }
                secondCard = this;
                checkForMatch();
            }

            function checkForMatch() {
                if (firstCard.dataset.id === secondCard.dataset.id) disableCards();
                else unflipCards();
            }

            function disableCards() {
                firstCard.classList.add('matched');
                secondCard.classList.add('matched');
                firstCard.querySelector('.card-front').innerHTML = '<i class="fa-solid fa-unlock"></i>';
                secondCard.querySelector('.card-front').innerHTML = '<i class="fa-solid fa-unlock"></i>';

                matchedPairs++;
                uiScore.innerText = matchedPairs;
                resetBoard();

                if (matchedPairs === targetPairs) {
                    
                    // --- THE AUDIO AND SAVE TRIGGER ---
                    AudioEngine.playSound('success');
                    AudioEngine.saveProgress('Match Score', matchedPairs); // Saves "6" to the hub!
                    // ----------------------------------

                    setTimeout(() => { victoryModal.style.display = 'flex'; }, 800);
                }
            }

            function unflipCards() {
                lockBoard = true;
                firstCard.classList.add('wrong'); secondCard.classList.add('wrong');
                setTimeout(() => {
                    firstCard.classList.remove('flipped', 'wrong'); secondCard.classList.remove('flipped', 'wrong');
                    resetBoard();
                }, 1000); 
            }

            function resetBoard() { [firstCard, secondCard] = [null, null]; lockBoard = false; }
        });
    </script>
</body>
</html>
